<!DOCTYPE html><html><head><meta charset="utf-8"><title>THE MUNCHIES™</title>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{display:block;margin:auto;max-width:100vw;max-height:100vh}</style></head>
<body><div style="display:none"><img src="art/bg.jpg"><img src="art/logo.png"><img src="art/mac.png"><img src="art/glaze.png"><img src="art/nacho.png"><img src="art/fryguy.png"><img src="art/shakey.png"><img src="art/brocmed.png"></div><canvas id="c" width="1280" height="720"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');
const load=s=>{const i=new Image();i.src=s;return i};
const bg=load('art/bg.jpg'),logo=load('art/logo.png');
const heroes=[['mac','#FFD700'],['glaze','#FF69B4'],['brocmed','#39FF14'],['nacho','#FF8C00'],['fryguy','#FF3030'],['shakey','#7FDBFF']].map(([n,col])=>({img:load('art/'+n+'.png'),col}));
const menu=['1 PLAYER','2 PLAYERS','HOW TO PLAY'];let sel=0;let t0=performance.now();
function glow(txt,px,py,size,col,blur){x.font=`900 ${size}px Impact,'Arial Black',sans-serif`;x.textAlign='center';
 x.shadowColor=col;for(const b of [blur*2,blur]){x.shadowBlur=b;x.fillStyle=col;x.fillText(txt,px,py)}
 x.shadowBlur=0;x.fillStyle='#fff';x.globalAlpha=.85;x.fillText(txt,px,py);x.globalAlpha=1}
function frame(now){const t=(now-t0)/1000;
 x.drawImage(bg,0,0,1280,720);
 const g=x.createLinearGradient(0,0,0,720);g.addColorStop(0,'rgba(5,0,20,.5)');g.addColorStop(.6,'rgba(5,0,20,.25)');g.addColorStop(1,'rgba(5,0,20,.85)');x.fillStyle=g;x.fillRect(0,0,1280,720);
 const pos=[[95,330],[250,470],[385,330],[895,330],[1030,470],[1185,330]];
 heroes.forEach((h,i)=>{let hh=270,w=hh*h.img.width/h.img.height;if(w>190){w=190;hh=w*h.img.height/h.img.width};const [cx,cy]=pos[i],bob=Math.sin(t*2+i)*4;
  x.save();x.shadowColor=h.col;x.shadowBlur=30;x.drawImage(h.img,cx-w/2,cy-hh/2+bob,w,hh);x.restore();});
 const lw=560,lh=lw*logo.height/logo.width;x.drawImage(logo,640-lw/2,0,lw,lh); // official logo, unaltered
 glow('SNACK PACK',640,lh+28,40,'#FF2BD6',16);
 if(Math.floor(t*1.6)%2==0)glow('PRESS START',640,450,44,'#FFD700',16);
 menu.forEach((m,i)=>glow((i==sel?'▶ ':'')+m+(i==sel?' ◀':''),640,520+i*52,i==sel?38:30,i==sel?'#FFE600':'#00E5FF',i==sel?18:6));
 x.font='16px Arial';x.textAlign='center';x.fillStyle='#ddd';x.fillText('© Munchman Media LLC. All rights reserved.',640,705);
 requestAnimationFrame(frame)}
function go(i){location.href='../sidescroller/index.html#'+['select1','select2','howto'][i]}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowUp'||k=='w'||k=='W')sel=(sel+2)%3;else if(k=='ArrowDown'||k=='s'||k=='S')sel=(sel+1)%3;else if(k=='Enter'||k==' '||k=='j'||k=='J')go(sel)});
document.querySelector('canvas').addEventListener('pointerdown',e=>{const r=e.target.getBoundingClientRect(),y=(e.clientY-r.top)*720/r.height;for(let i=0;i<3;i++)if(Math.abs(y-(508+i*52))<24){sel=i;go(i)}});
let gpPrev=0;setInterval(()=>{const g=(navigator.getGamepads?navigator.getGamepads():[])[0];if(!g)return;const v=g.axes[1]||0,u=g.buttons[12]&&g.buttons[12].pressed,d=g.buttons[13]&&g.buttons[13].pressed,a=g.buttons[0].pressed||g.buttons[9].pressed;const st=(u||v<-.5)?1:(d||v>.5)?2:a?3:0;if(st!=gpPrev){if(st==1)sel=(sel+2)%3;if(st==2)sel=(sel+1)%3;if(st==3)go(sel)}gpPrev=st},60);
addEventListener('load',()=>{t0=performance.now();frame(t0)});
</script></body></html>
